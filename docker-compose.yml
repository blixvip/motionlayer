services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: motionlayer
      POSTGRES_PASSWORD: motionlayer
      POSTGRES_DB: motionlayer
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    networks: [render-internal]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: replace-me-now
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  render-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      RENDER_PROJECT_ROOT: /work/projects
      RENDER_CONCURRENCY: 1
    depends_on: [redis]
    volumes: ["./data/projects:/work/projects"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=2g", "/tmp/render-home:rw,nosuid,size=256m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [render-internal]
volumes:
  postgres-data:
  redis-data:
  minio-data:
networks:
  render-internal:
    internal: true
