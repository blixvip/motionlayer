<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <style>
      @font-face { font-family: "Inter"; src: url("fonts/Inter-400-latin.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-700-latin.woff2") format("woff2"); font-weight: 700; font-display: block; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: "Inter", sans-serif; }
      #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
      #source-video { position: absolute; inset: 0; width: 1280px; height: 720px; object-fit: cover; }
      .motion-card { position: absolute; inset: 0; pointer-events: none; color: #f4f7f1; overflow: hidden; }
      .ink-panel { background: rgba(8, 11, 13, .88); border: 1px solid rgba(236, 241, 233, .18); box-shadow: 0 16px 42px rgba(0, 0, 0, .28); }
      .kicker { color: #c8ff3d; font-size: 14px; line-height: 1; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .hook-lockup { position: absolute; left: 82px; top: 102px; width: 610px; }
      .hook-title { margin: 18px 0 10px; font-size: 76px; line-height: .94; letter-spacing: -.055em; font-weight: 700; }
      .hook-detail { font-size: 20px; color: #d4d9d4; }
      .registration-line { width: 360px; height: 3px; margin-top: 28px; background: #c8ff3d; transform-origin: 0 50%; }
      .lower-lockup { position: absolute; left: 82px; bottom: 92px; display: flex; align-items: stretch; gap: 14px; padding: 16px 22px 15px 16px; }
      .lower-rule { width: 4px; height: 58px; background: #c8ff3d; transform-origin: 50% 100%; }
      .lower-copy { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
      .lower-copy strong { font-size: 25px; line-height: 1; letter-spacing: -.02em; }
      .step-card { position: absolute; right: 72px; top: 92px; width: 390px; padding: 28px 30px; }
      .step-card h2 { margin: 12px 0 20px; font-size: 34px; line-height: 1; letter-spacing: -.04em; }
      .step-row { display: flex; align-items: center; gap: 18px; height: 62px; border-top: 1px solid rgba(255, 255, 255, .16); font-size: 22px; }
      .step-row b { color: #c8ff3d; font-size: 13px; }
      .quote-lockup { position: absolute; right: 72px; top: 96px; width: 425px; padding: 28px; }
      .quote-lockup strong { display: block; font-size: 49px; line-height: .94; letter-spacing: -.05em; }
      .quote-lockup i { display: block; width: 52px; height: 3px; margin-top: 23px; background: #c8ff3d; transform-origin: 0 50%; }
      .stat-lockup { position: absolute; left: 82px; top: 88px; padding: 28px 32px 26px; width: 340px; }
      .stat-number { display: block; color: #c8ff3d; font-size: 104px; line-height: .8; font-weight: 700; letter-spacing: -.07em; }
      .stat-lockup strong { display: block; margin-top: 16px; font-size: 27px; line-height: 1; }
      .stat-lockup small { display: block; margin-top: 10px; color: #bdc5bd; font-size: 14px; }
      .register { position: absolute; inset: 36px; border: 1px solid rgba(255,255,255,.13); }
      .register::before, .register::after { content: ""; position: absolute; width: 14px; height: 14px; border-color: #c8ff3d; }
      .register::before { left: -1px; top: -1px; border-left: 2px solid #c8ff3d; border-top: 2px solid #c8ff3d; }
      .register::after { right: -1px; bottom: -1px; border-right: 2px solid #c8ff3d; border-bottom: 2px solid #c8ff3d; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="talking-head-recut" data-start="0" data-duration="18" data-fps="30" data-width="1280" data-height="720">
      <video id="source-video" class="clip" src="assets/input-video.mp4" muted playsinline data-start="0" data-duration="18" data-track-index="0"></video>
      <audio id="source-audio" src="assets/input-video.mp4" data-start="0" data-duration="18" data-track-index="9" data-volume="1"></audio>
      <section id="mg-hook" class="motion-card clip" data-start="0.45" data-duration="2.65" data-track-index="2"><div class="register" data-layout-ignore></div><div class="hook-lockup"><span id="mg-hook-kicker" class="kicker">Motion with intention</span><h1 id="mg-hook-title" class="hook-title">Protect the edit.</h1><div id="mg-hook-detail" class="hook-detail" data-layout-allow-overlap>Add only what earns its frame.</div><div id="mg-hook-line" class="registration-line"></div></div></section>
      <section id="mg-lower" class="motion-card clip" data-start="3.8" data-duration="3.2" data-track-index="2" data-layout-allow-caption-zone><div id="mg-lower-card" class="lower-lockup ink-panel"><div id="mg-lower-rule" class="lower-rule"></div><div class="lower-copy"><span class="kicker">Source edit</span><strong>Locked · timing preserved</strong></div></div></section>
      <section id="mg-steps" class="motion-card clip" data-start="7.7" data-duration="3.85" data-track-index="2"><div id="mg-steps-card" class="step-card ink-panel"><span class="kicker">Three inspectable stages</span><h2>From source to motion</h2><div class="step-row"><b>01</b><span>Understand</span></div><div class="step-row"><b>02</b><span>Plan</span></div><div class="step-row"><b>03</b><span>Generate</span></div></div></section>
      <section id="mg-quote" class="motion-card clip" data-start="12" data-duration="3.05" data-track-index="2"><div id="mg-quote-card" class="quote-lockup ink-panel"><strong>Less decoration.<br />Clearer ideas.</strong><i id="mg-quote-line"></i></div></section>
      <section id="mg-stat" class="motion-card clip" data-start="15.35" data-duration="2.45" data-track-index="2"><div id="mg-stat-card" class="stat-lockup ink-panel"><span id="mg-stat-number" class="stat-number">3</span><strong>deliberate passes</strong><small>Approve · Revise · Export</small></div></section>
    </div>
    <script src="vendor/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mg-hook-kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .36, ease: "power2.out", immediateRender: false }, .45);
      tl.fromTo("#mg-hook-title", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: .56, ease: "power3.out", immediateRender: false }, .62);
      tl.fromTo("#mg-hook-detail", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .4, ease: "power2.out", immediateRender: false }, .9);
      tl.fromTo("#mg-hook-line", { scaleX: 0 }, { scaleX: 1, duration: .6, ease: "power3.out", immediateRender: false }, .98);
      tl.to("#mg-hook .hook-lockup", { opacity: 0, y: -22, duration: .3, ease: "power2.in" }, 2.72);
      tl.fromTo("#mg-lower-card", { opacity: 0, y: 42 }, { opacity: 1, y: 0, duration: .46, ease: "power3.out", immediateRender: false }, 3.8);
      tl.fromTo("#mg-lower-rule", { scaleY: 0 }, { scaleY: 1, duration: .36, ease: "power2.out", immediateRender: false }, 3.96);
      tl.to("#mg-lower-card", { opacity: 0, y: 18, duration: .3, ease: "power2.in" }, 6.62);
      tl.fromTo("#mg-steps-card", { opacity: 0, x: 54 }, { opacity: 1, x: 0, duration: .48, ease: "power3.out", immediateRender: false }, 7.7);
      tl.fromTo("#mg-steps-card .step-row", { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: .34, stagger: .17, ease: "power2.out", immediateRender: false }, 8.08);
      tl.to("#mg-steps-card", { opacity: 0, x: 30, duration: .32, ease: "power2.in" }, 11.16);
      tl.fromTo("#mg-quote-card", { opacity: 0, filter: "blur(12px)", y: 24 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: .54, ease: "power2.out", immediateRender: false }, 12);
      tl.fromTo("#mg-quote-line", { scaleX: 0 }, { scaleX: 1, duration: .5, ease: "power3.out", immediateRender: false }, 12.42);
      tl.to("#mg-quote-card", { opacity: 0, filter: "blur(8px)", duration: .3, ease: "power2.in" }, 14.68);
      const counter = { value: 0 };
      tl.fromTo("#mg-stat-card", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: .42, ease: "power3.out", immediateRender: false }, 15.35);
      tl.to(counter, { value: 3, duration: .72, ease: "power3.out", onUpdate: () => { document.getElementById("mg-stat-number").textContent = String(Math.round(counter.value)); } }, 15.48);
      tl.to("#mg-stat-card", { opacity: 0, y: -14, duration: .25, ease: "power2.in" }, 17.52);
      window.__timelines["talking-head-recut"] = tl;
    </script>
  </body>
</html>
